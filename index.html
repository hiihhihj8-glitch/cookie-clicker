<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker Empire - Prestige & Offline Edition</title>
    <!-- PeerJS for serverless browser-to-browser multiplayer & chat -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c1d11, #4a3319);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        /* Top-Right Sound & Volume Control */
        .audio-bar {
            position: fixed;
            top: 12px;
            right: 15px;
            background: rgba(0, 0, 0, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(6px);
            padding: 6px 12px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 2000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .mute-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
        }
        .volume-slider {
            width: 75px;
            accent-color: #f1c40f;
            cursor: pointer;
        }

        /* Offline Earnings Welcome Banner */
        .offline-banner {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #1e3799, #0984e3);
            border: 2px solid #74b9ff;
            color: #fff;
            padding: 10px 18px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            z-index: 3000;
            display: none;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            max-width: 90vw;
        }
        .offline-close {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 6px;
            padding: 4px 9px;
            cursor: pointer;
        }

        .game-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            align-items: flex-start;
            max-width: 1420px;
            width: 100%;
            padding: 48px 15px 20px 15px;
            box-sizing: border-box;
            justify-content: center;
        }

        .panel {
            background: rgba(0, 0, 0, 0.58);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            position: relative;
        }

        .game-container {
            text-align: center;
            width: 320px;
            flex-shrink: 0;
        }

        .side-panel {
            width: 295px;
            max-height: 780px;
            overflow-y: auto;
        }

        h1 {
            font-size: 1.85rem;
            margin: 0 0 5px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        h2 {
            font-size: 1.08rem;
            margin: 0 0 10px 0;
            color: #e67e22;
            text-align: center;
            border-bottom: 2px solid rgba(230, 126, 34, 0.3);
            padding-bottom: 4px;
        }

        .score-container {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: #f1c40f;
        }

        .heavenly-badge {
            display: inline-block;
            background: rgba(116, 185, 255, 0.18);
            border: 1px solid #74b9ff;
            color: #a3d5ff;
            font-size: 0.76rem;
            font-weight: bold;
            padding: 3px 9px;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .multiplier-status {
            font-size: 0.85rem;
            color: #e74c3c;
            font-weight: bold;
            height: 18px;
            margin-bottom: 5px;
            animation: pulse 1s infinite alternate;
            display: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Co-op Sugar Monster Boss Raid Card */
        .boss-card {
            background: linear-gradient(135deg, rgba(192, 57, 43, 0.35), rgba(142, 68, 173, 0.35));
            border: 2px solid #ff7675;
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 12px;
            text-align: center;
            box-shadow: 0 0 18px rgba(255, 118, 117, 0.25);
        }
        .boss-sprite {
            font-size: 2.5rem;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.05s;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
        }
        .boss-sprite:active {
            transform: scale(0.86) rotate(-6deg);
        }
        .hp-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(0,0,0,0.6);
            border-radius: 8px;
            overflow: hidden;
            margin: 6px 0;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .hp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff7675, #d63031);
            width: 100%;
            transition: width 0.15s ease;
        }

        /* Cookie Themes (Main Cookie & Locker Swatches) */
        .cookie {
            width: 145px;
            height: 145px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            transition: transform 0.05s ease, background 0.4s, border-color 0.4s, box-shadow 0.4s;
            margin: 0 auto 12px auto;
            position: relative;
        }

        .skin-swatch {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            position: relative;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        /* 1. Classic */
        .skin-classic {
            background: radial-gradient(circle, #d35400 20%, #e67e22 21%);
            background-size: 20px 20px;
            background-color: #f39c12;
            border: 6px solid #cf7115;
        }
        .cookie.skin-classic::before {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background-image: radial-gradient(circle, #6e3d16 6px, transparent 7px),
                              radial-gradient(circle, #6e3d16 5px, transparent 6px),
                              radial-gradient(circle, #6e3d16 7px, transparent 8px);
            background-position: 30px 40px, 98px 46px, 68px 94px;
            background-repeat: no-repeat;
        }

        /* 2. White Macadamia */
        .skin-macadamia {
            background: radial-gradient(circle, #f5cba7 20%, #fad7a0 21%);
            background-size: 18px 18px;
            background-color: #f8c471;
            border: 6px solid #d4ac0d;
        }
        .cookie.skin-macadamia::before {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background-image: radial-gradient(circle, #fdfefe 7px, transparent 8px),
                              radial-gradient(circle, #fdfefe 6px, transparent 7px),
                              radial-gradient(circle, #fdfefe 8px, transparent 9px);
            background-position: 28px 38px, 96px 48px, 64px 92px;
            background-repeat: no-repeat;
        }

        /* 3. Double Fudge */
        .skin-fudge {
            background: radial-gradient(circle, #3e2723 20%, #4e342e 21%);
            background-size: 18px 18px;
            background-color: #5d4037;
            border: 6px solid #281815;
        }
        .cookie.skin-fudge::before {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background-image: radial-gradient(circle, #1b0f0d 7px, transparent 8px),
                              radial-gradient(circle, #8d6e63 5px, transparent 6px),
                              radial-gradient(circle, #1b0f0d 8px, transparent 9px);
            background-position: 30px 40px, 98px 46px, 68px 94px;
            background-repeat: no-repeat;
        }

        /* 4. Cyber Neon */
        .skin-neon {
            background: radial-gradient(circle, #8e44ad 20%, #2c3e50 21%);
            background-size: 20px 20px;
            background-color: #1a252f;
            border: 6px solid #00f2fe;
            box-shadow: 0 0 20px #00f2fe, inset 0 0 12px #4facfe;
        }
        .cookie.skin-neon::before {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background-image: radial-gradient(circle, #ff007f 6px, transparent 7px),
                              radial-gradient(circle, #00f2fe 5px, transparent 6px),
                              radial-gradient(circle, #00ff87 7px, transparent 8px);
            background-position: 30px 40px, 98px 46px, 68px 94px;
            background-repeat: no-repeat;
        }

        /* 5. 24K Golden Crown */
        .skin-gold {
            background: radial-gradient(circle, #fff3b0 15%, #f1c40f 45%, #d4ac0d 90%);
            background-color: #f1c40f;
            border: 6px solid #fff;
            box-shadow: 0 0 25px #f1c40f, inset 0 0 15px #fff;
        }

        /* 6. Achievement Exclusive: Rainbow Prism */
        .skin-rainbow {
